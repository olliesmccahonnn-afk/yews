name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Look up matching Fabric versions for 1.21.11
        run: |
          YARN=$(curl -s https://meta.fabricmc.net/v2/versions/yarn/1.21.11 | jq -r '.[0].version')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -s 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.11%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER fabric-api=$FAPI"
          echo "GRADLE_ARGS=-Pyarn_mappings=$YARN -Ploader_version=$LOADER -Pfabric_version=$FAPI" >> "$GITHUB_ENV"

      - name: Build
        run: gradle build $GRADLE_ARGS

      - name: Collect jar
        run: |
          mkdir out
          cp $(ls build/libs/*.jar | grep -v -- '-sources') out/

      - uses: actions/upload-artifact@v4
        with:
          name: myth-jar
          path: out/*.jar
